<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDA Automation Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 EDA Automation Dashboard</h1>
            <p class="subtitle">Comprehensive Dataset Analysis Tool</p>
        </header>
        
        <div class="dataset-info">
            <span class="badge">Dataset: <strong>crop_yield.csv</strong></span>
        </div>
        
        <div class="controls">
            <button id="analyze-btn" class="btn-primary">
                <span class="btn-icon">🔍</span>
                Run Analysis
            </button>
        </div>

        <div id="loader" class="loader hidden">
            <div class="spinner"></div>
            <p>Processing your data...</p>
        </div>

        <div id="results-container" class="hidden">
            <!-- Overview Section -->
            <section class="card" id="overview-section">
                <h2>📋 Dataset Overview</h2>
                <div class="stats-grid" id="overview-grid"></div>
            </section>

            <!-- Missing Values Section -->
            <section class="card" id="missing-section">
                <h2>🔍 Missing Values Analysis</h2>
                <div id="missing-summary" class="summary-box"></div>
                <div id="missing-details" class="table-container"></div>
            </section>

            <!-- Duplicates Section -->
            <section class="card" id="duplicates-section">
                <h2>📑 Duplicate Records</h2>
                <div id="duplicates-info" class="summary-box"></div>
            </section>

            <!-- Statistics Section -->
            <section class="card" id="statistics-section">
                <h2>📈 Descriptive Statistics</h2>
                <div id="statistics-table" class="table-container"></div>
            </section>

            <!-- Sample Data Section -->
            <section class="card" id="sample-section">
                <h2>👁️ Sample Data</h2>
                <div id="sample-note" class="note"></div>
                <div id="sample-table" class="table-container"></div>
            </section>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
